[config]
schemaVersion = "0.0.1"

[package]
namespace = "AngelcoMilk"
name = "MoreSlots"
versionNumber = "0.1.0"
description = "Expands YAPYAP inventory from 3 to up to 10 slots with configurable key bindings."
websiteUrl = "https://github.com/AngelcoMilk/MoreSlots"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./dist"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = ["yapyap"]
[publish.categories]
yapyap = ["mods", "client", "wands"]
